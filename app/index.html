<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A contributor-focused overview of project status, ownership, activity, and priority.">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">
        <p class="eyebrow">Contributor overview</p>
        <h1>Project Pulse</h1>
        <p class="intro">A quick, clear view of project ownership, progress, and where contributors can help.</p>
      </div>
    </header>

    <main class="page-width">
      <section class="dashboard" aria-labelledby="projects-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Team projects</p>
            <h2 id="projects-heading">Projects</h2>
          </div>
          <p class="sample-note">Illustrative sample data — not live project information.</p>
        </div>
        <p id="project-status" class="load-status" role="status" aria-live="polite">Loading projects…</p>
        <div id="project-list" class="project-grid"></div>
      </section>
    </main>

    <script>
      const projectList = document.querySelector("#project-list");
      const projectStatus = document.querySelector("#project-status");

      function addField(list, label, value, className = "") {
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value;
        if (className) {
          description.className = className;
        }
        list.append(term, description);
      }

      function renderProject(project) {
        const card = document.createElement("article");
        card.className = "project-card";

        const heading = document.createElement("h3");
        heading.textContent = project.name;

        const details = document.createElement("dl");
        details.className = "project-details";
        addField(details, "Owner", project.owner);
        addField(details, "Status", project.status, "badge badge-status");
        addField(details, "Recent activity", project.recentActivity);
        addField(details, "Priority", project.priority, "badge badge-priority");

        const summary = document.createElement("p");
        summary.className = "project-summary";
        summary.textContent = project.summary;

        card.append(heading, details, summary);
        return card;
      }

      fetch("project-data.json")
        .then((response) => {
          if (!response.ok) {
            throw new Error("Project data could not be loaded.");
          }
          return response.json();
        })
        .then((data) => {
          if (!Array.isArray(data.projects) || data.projects.length === 0) {
            projectStatus.textContent = "No projects are available yet.";
            return;
          }
          projectList.replaceChildren(...data.projects.map(renderProject));
          projectStatus.textContent = `${data.projects.length} illustrative projects`;
        })
        .catch(() => {
          projectStatus.textContent = "Projects could not be loaded. Please try again later.";
        });
    </script>
  </body>
</html>
